<div id="div-form">
    <h2>Lista de frutas</h2>

    <form id="formulario">
        <label for="descricao">Descrição</label>
        <input type="text" name="descricao" id="descricao" [(ngModel)]="descricao_produto">

        <label for="valor_unitario">Valor Unitário</label>
        <input type="number" name="valor_unitario" id="valor_unitario" [(ngModel)]="valor_unitario">

        <div id="div-btns">
            <button type="button" id="btnAdd" (click)="addItem()"> Adicionar </button>
            <button type="button" id="btnLimpar" (click)="limparTudo()"> Limpar </button>
        </div>
    </form>

    <div id="div-lista">

        @for(elem of listaProdutos(); track elem.id ){
            <div class="div-item"> 
                <span class="item-fruta">
                    {{elem.id}} - {{elem.descricaoProduto}} - R$ {{elem.valorUnitario?.toFixed(2)?.replace('.',',')}}
                </span>
                <span class="btns-lista">
                    <a class="lnk-editar" (click)="buscarPorId(elem)"> Editar </a>
                    <a class="lnk-excluir"  (click)="exluir(elem)"> Excluir </a>
                </span>
            </div>
            
        }@empty {
            <div class="div-item"> NENHUM ITEM ADICIONADO!!! </div>
        }

    </div>
</div>
